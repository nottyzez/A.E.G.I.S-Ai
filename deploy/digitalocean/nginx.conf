server {
    listen 80;
    server_name _;

    # Leaf-photo uploads from the ESP32-CAM are the only large body.
    client_max_body_size 10M;

    # ESP32 long-polls /api/command. Buffering would hold the reply until the
    # poll closes, turning a 2.5 s poll into a 2.5 s delay on every command.
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/command {
        proxy_pass http://aegis:8000;
        # Must exceed the ESP32's wait_ms, or Nginx cuts the poll with a 504.
        proxy_read_timeout 65s;
    }

    location / {
        proxy_pass http://aegis:8000;
        proxy_read_timeout 120s;
    }
}
