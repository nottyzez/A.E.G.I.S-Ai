<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 Plant Monitor Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            color: #e0e0e0;
            overflow-x: hidden;
        }

        /* ===== HEADER ===== */
        .header {
            text-align: center;
            padding: 30px 20px 10px;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #43e97b, #38f9d7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 1rem;
            color: #90caf9;
            font-weight: 300;
        }

        .timestamp {
            text-align: center;
            font-size: 0.85rem;
            color: #78909c;
            margin-bottom: 20px;
        }

        /* ===== STATUS INDICATOR ===== */
        .status-bar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #43e97b;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { box-shadow: 0 0 0 0 rgba(67, 233, 123, 0.5); }
            50% { box-shadow: 0 0 0 8px rgba(67, 233, 123, 0); }
        }

        .status-text {
            font-size: 0.85rem;
            color: #43e97b;
            font-weight: 400;
        }

        /* ===== CARDS GRID ===== */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 28px;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: default;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            border-radius: 20px 20px 0 0;
        }

        .card.ph::before { background: linear-gradient(90deg, #667eea, #764ba2); }
        .card.ec::before { background: linear-gradient(90deg, #f093fb, #f5576c); }
        .card.temp::before { background: linear-gradient(90deg, #fa709a, #fee140); }

        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .card-icon {
            font-size: 2rem;
        }

        .card-label {
            font-size: 0.9rem;
            color: #90a4ae;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-value-container {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 3.5rem;
            font-weight: 700;
            line-height: 1;
        }

        .card.ph .card-value { color: #a78bfa; }
        .card.ec .card-value { color: #f472b6; }
        .card.temp .card-value { color: #fbbf24; }

        .card-unit {
            font-size: 1.1rem;
            color: #78909c;
            font-weight: 300;
        }

        .card-range {
            font-size: 0.8rem;
            color: #546e7a;
            margin-bottom: 16px;
        }

        .card-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 500;
            margin-bottom: 16px;
        }

        .card-status.good {
            background: rgba(67, 233, 123, 0.15);
            color: #43e97b;
        }

        .card-status.warning {
            background: rgba(251, 191, 36, 0.15);
            color: #fbbf24;
        }

        .card-status.danger {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        /* Mini sparkline area */
        .mini-chart-container {
            height: 60px;
            margin: 12px -8px 16px;
        }

        .trend-btn {
            width: 100%;
            padding: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.04);
            color: #90caf9;
            font-family: 'Kanit', sans-serif;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .trend-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.25);
            color: #fff;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: linear-gradient(145deg, #1a2a3a, #162230);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 24px 28px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-title {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.04);
            color: #90a4ae;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .modal-close:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }

        .modal-body {
            padding: 24px 28px 28px;
        }

        /* Time range selector */
        .time-range {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .time-btn {
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: transparent;
            color: #78909c;
            font-family: 'Kanit', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .time-btn:hover {
            border-color: rgba(255, 255, 255, 0.2);
            color: #ccc;
        }

        .time-btn.active {
            background: rgba(67, 233, 123, 0.15);
            border-color: rgba(67, 233, 123, 0.3);
            color: #43e97b;
        }

        .chart-container {
            height: 350px;
            position: relative;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-top: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #78909c;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .header h1 { font-size: 1.6rem; }
            .card-value { font-size: 2.8rem; }
            .cards-container { padding: 0 16px 30px; gap: 16px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .chart-container { height: 250px; }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <h1>🌱 Plant Monitor Dashboard</h1>
        <p>ระบบตรวจวัดคุณภาพน้ำและสภาพแวดล้อมสำหรับพืช</p>
    </div>
    <div class="timestamp" id="currentTime"></div>
    <div class="status-bar">
        <div class="status-dot"></div>
        <span class="status-text">เชื่อมต่อเซ็นเซอร์อยู่ — อัปเดตทุก 5 วินาที</span>
    </div>

    <!-- CARDS -->
    <div class="cards-container">

        <!-- pH Card -->
        <div class="card ph">
            <div class="card-header">
                <span class="card-icon">🧪</span>
                <span class="card-label">ค่า pH</span>
            </div>
            <div class="card-value-container">
                <span class="card-value" id="phValue">--</span>
                <span class="card-unit">pH</span>
            </div>
            <div class="card-range">ค่าที่เหมาะสม: 5.5 – 6.5</div>
            <div class="card-status good" id="phStatus">
                <span>●</span> ปกติ
            </div>
            <div class="mini-chart-container">
                <canvas id="phSparkline"></canvas>
            </div>
            <button class="trend-btn" onclick="openModal('ph')">
                📊 ดูแนวโน้มย้อนหลัง
            </button>
        </div>

        <!-- EC Card -->
        <div class="card ec">
            <div class="card-header">
                <span class="card-icon">⚡</span>
                <span class="card-label">ค่า EC</span>
            </div>
            <div class="card-value-container">
                <span class="card-value" id="ecValue">--</span>
                <span class="card-unit">mS/cm</span>
            </div>
            <div class="card-range">ค่าที่เหมาะสม: 1.2 – 2.5 mS/cm</div>
            <div class="card-status good" id="ecStatus">
                <span>●</span> ปกติ
            </div>
            <div class="mini-chart-container">
                <canvas id="ecSparkline"></canvas>
            </div>
            <button class="trend-btn" onclick="openModal('ec')">
                📊 ดูแนวโน้มย้อนหลัง
            </button>
        </div>

        <!-- Temperature Card -->
        <div class="card temp">
            <div class="card-header">
                <span class="card-icon">🌡️</span>
                <span class="card-label">อุณหภูมิ</span>
            </div>
            <div class="card-value-container">
                <span class="card-value" id="tempValue">--</span>
                <span class="card-unit">°C</span>
            </div>
            <div class="card-range">ค่าที่เหมาะสม: 22 – 28 °C</div>
            <div class="card-status good" id="tempStatus">
                <span>●</span> ปกติ
            </div>
            <div class="mini-chart-container">
                <canvas id="tempSparkline"></canvas>
            </div>
            <button class="trend-btn" onclick="openModal('temp')">
                📊 ดูแนวโน้มย้อนหลัง
            </button>
        </div>

    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModalOutside(event)">
        <div class="modal">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">แนวโน้ม</span>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body">
                <div class="time-range" id="timeRange"></div>
                <div class="chart-container">
                    <canvas id="trendChart"></canvas>
                </div>
                <div class="stats-grid" id="statsGrid"></div>
            </div>
        </div>
    </div>

    <script>
    // ================================================================
    //  DATA SIMULATION — Replace with real API calls for production
    // ================================================================

    const SENSOR_CONFIG = {
        ph: {
            label: 'ค่า pH',
            icon: '🧪',
            unit: 'pH',
            min: 4.0, max: 8.5,
            idealMin: 5.5, idealMax: 6.5,
            baseValue: 6.0,
            noise: 0.3,
            color: 'rgba(167, 139, 250, 1)',
            colorFill: 'rgba(167, 139, 250, 0.15)',
            borderColor: 'rgba(167, 139, 250, 0.6)',
        },
        ec: {
            label: 'ค่า EC',
            icon: '⚡',
            unit: 'mS/cm',
            min: 0.5, max: 4.0,
            idealMin: 1.2, idealMax: 2.5,
            baseValue: 1.8,
            noise: 0.25,
            color: 'rgba(244, 114, 182, 1)',
            colorFill: 'rgba(244, 114, 182, 0.15)',
            borderColor: 'rgba(244, 114, 182, 0.6)',
        },
        temp: {
            label: 'อุณหภูมิ',
            icon: '🌡️',
            unit: '°C',
            min: 15, max: 40,
            idealMin: 22, idealMax: 28,
            baseValue: 25,
            noise: 1.5,
            color: 'rgba(251, 191, 36, 1)',
            colorFill: 'rgba(251, 191, 36, 0.15)',
            borderColor: 'rgba(251, 191, 36, 0.6)',
        },
    };

    // Store historical data
    const historyData = { ph: [], ec: [], temp: [] };
    const HISTORY_POINTS = 200;  // Keep last N data points in memory

    // Generate initial historical data (simulate past 24 hours)
    function initHistory() {
        const now = Date.now();
        for (let i = HISTORY_POINTS; i >= 0; i--) {
            const t = now - i * 5 * 60 * 1000; // Every 5 min over ~16 hours
            for (const key of ['ph', 'ec', 'temp']) {
                const cfg = SENSOR_CONFIG[key];
                // Create a slow wave + small noise
                const wave = Math.sin(i / 30) * cfg.noise * 0.7;
                const drift = Math.sin(i / 80) * cfg.noise * 0.4;
                const jitter = (Math.random() - 0.5) * cfg.noise * 0.5;
                let val = cfg.baseValue + wave + drift + jitter;
                val = Math.max(cfg.min, Math.min(cfg.max, val));
                historyData[key].push({ x: t, y: parseFloat(val.toFixed(2)) });
            }
        }
    }
    initHistory();

    // Generate a new reading (simulate real-time sensor)
    function generateReading(key) {
        const cfg = SENSOR_CONFIG[key];
        const last = historyData[key][historyData[key].length - 1]?.y ?? cfg.baseValue;
        const delta = (Math.random() - 0.5) * cfg.noise * 0.6;
        let val = last + delta;
        // Mean-revert gently toward base
        val += (cfg.baseValue - val) * 0.05;
        val = Math.max(cfg.min, Math.min(cfg.max, val));
        return parseFloat(val.toFixed(2));
    }

    function getStatus(key, value) {
        const cfg = SENSOR_CONFIG[key];
        if (value >= cfg.idealMin && value <= cfg.idealMax) return 'good';
        const margin = (cfg.idealMax - cfg.idealMin) * 0.5;
        if (value >= cfg.idealMin - margin && value <= cfg.idealMax + margin) return 'warning';
        return 'danger';
    }

    function statusText(status) {
        if (status === 'good') return '<span>●</span> ปกติ';
        if (status === 'warning') return '<span>●</span> เฝ้าระวัง';
        return '<span>●</span> ผิดปกติ';
    }

    // ================================================================
    //  SPARKLINE MINI CHARTS
    // ================================================================

    const sparklines = {};

    function createSparkline(canvasId, key) {
        const ctx = document.getElementById(canvasId).getContext('2d');
        const cfg = SENSOR_CONFIG[key];
        const last30 = historyData[key].slice(-30);

        sparklines[key] = new Chart(ctx, {
            type: 'line',
            data: {
                labels: last30.map(d => d.x),
                datasets: [{
                    data: last30.map(d => d.y),
                    borderColor: cfg.color,
                    backgroundColor: cfg.colorFill,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 0,
                    borderWidth: 2,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } },
                scales: {
                    x: { display: false },
                    y: { display: false },
                },
                animation: { duration: 500 },
            }
        });
    }

    function updateSparkline(key) {
        const chart = sparklines[key];
        const last30 = historyData[key].slice(-30);
        chart.data.labels = last30.map(d => d.x);
        chart.data.datasets[0].data = last30.map(d => d.y);
        chart.update('none');
    }

    // ================================================================
    //  TREND MODAL CHART
    // ================================================================

    let trendChart = null;
    let currentModalKey = null;
    let currentRange = '24h';

    const TIME_RANGES = {
        '1h':  { label: '1 ชั่วโมง', ms: 60 * 60 * 1000 },
        '6h':  { label: '6 ชั่วโมง', ms: 6 * 60 * 60 * 1000 },
        '12h': { label: '12 ชั่วโมง', ms: 12 * 60 * 60 * 1000 },
        '24h': { label: '24 ชั่วโมง', ms: 24 * 60 * 60 * 1000 },
        'all': { label: 'ทั้งหมด', ms: Infinity },
    };

    function openModal(key) {
        currentModalKey = key;
        currentRange = '24h';
        const cfg = SENSOR_CONFIG[key];

        document.getElementById('modalTitle').textContent = `${cfg.icon} แนวโน้ม${cfg.label}`;

        // Build time range buttons
        const rangeContainer = document.getElementById('timeRange');
        rangeContainer.innerHTML = '';
        for (const [k, v] of Object.entries(TIME_RANGES)) {
            const btn = document.createElement('button');
            btn.className = 'time-btn' + (k === currentRange ? ' active' : '');
            btn.textContent = v.label;
            btn.onclick = () => selectRange(k);
            rangeContainer.appendChild(btn);
        }

        renderTrendChart(key, currentRange);
        renderStats(key, currentRange);

        document.getElementById('modalOverlay').classList.add('active');
        document.body.style.overflow = 'hidden';
    }

    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('active');
        document.body.style.overflow = '';
        if (trendChart) { trendChart.destroy(); trendChart = null; }
    }

    function closeModalOutside(e) {
        if (e.target === document.getElementById('modalOverlay')) closeModal();
    }

    function selectRange(range) {
        currentRange = range;
        document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');
        renderTrendChart(currentModalKey, range);
        renderStats(currentModalKey, range);
    }

    function getFilteredData(key, range) {
        const data = historyData[key];
        if (range === 'all') return data;
        const cutoff = Date.now() - TIME_RANGES[range].ms;
        return data.filter(d => d.x >= cutoff);
    }

    function renderTrendChart(key, range) {
        const cfg = SENSOR_CONFIG[key];
        const data = getFilteredData(key, range);

        if (trendChart) trendChart.destroy();

        const ctx = document.getElementById('trendChart').getContext('2d');

        // Ideal range band
        const idealMin = Array(data.length).fill(cfg.idealMin);
        const idealMax = Array(data.length).fill(cfg.idealMax);

        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: data.map(d => new Date(d.x)),
                datasets: [
                    {
                        label: cfg.label,
                        data: data.map(d => d.y),
                        borderColor: cfg.color,
                        backgroundColor: cfg.colorFill,
                        fill: true,
                        tension: 0.3,
                        pointRadius: data.length > 60 ? 0 : 3,
                        pointHoverRadius: 5,
                        borderWidth: 2.5,
                    },
                    {
                        label: 'ค่าสูงสุดที่เหมาะสม',
                        data: idealMax,
                        borderColor: 'rgba(67, 233, 123, 0.4)',
                        borderDash: [6, 4],
                        borderWidth: 1.5,
                        pointRadius: 0,
                        fill: false,
                    },
                    {
                        label: 'ค่าต่ำสุดที่เหมาะสม',
                        data: idealMin,
                        borderColor: 'rgba(67, 233, 123, 0.4)',
                        borderDash: [6, 4],
                        borderWidth: 1.5,
                        pointRadius: 0,
                        fill: '-1',
                        backgroundColor: 'rgba(67, 233, 123, 0.06)',
                    },
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        labels: {
                            color: '#90a4ae',
                            font: { family: 'Kanit', size: 12 },
                            usePointStyle: true,
                            padding: 16,
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(20, 30, 40, 0.95)',
                        titleColor: '#e0e0e0',
                        bodyColor: '#b0bec5',
                        titleFont: { family: 'Kanit' },
                        bodyFont: { family: 'Kanit' },
                        borderColor: 'rgba(255,255,255,0.1)',
                        borderWidth: 1,
                        cornerRadius: 10,
                        padding: 12,
                        callbacks: {
                            title: (items) => {
                                const date = new Date(items[0].parsed.x || items[0].label);
                                return date.toLocaleString('th-TH');
                            },
                            label: (ctx) => {
                                if (ctx.datasetIndex === 0) {
                                    return ` ${cfg.label}: ${ctx.parsed.y} ${cfg.unit}`;
                                }
                                return null;
                            }
                        }
                    }
                },
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            tooltipFormat: 'PPpp',
                            displayFormats: {
                                minute: 'HH:mm',
                                hour: 'HH:mm',
                            }
                        },
                        ticks: {
                            color: '#546e7a',
                            font: { family: 'Kanit', size: 11 },
                            maxTicksLimit: 10,
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.04)',
                        }
                    },
                    y: {
                        ticks: {
                            color: '#546e7a',
                            font: { family: 'Kanit', size: 11 },
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.04)',
                        }
                    }
                },
                animation: { duration: 600 },
            }
        });
    }

    function renderStats(key, range) {
        const cfg = SENSOR_CONFIG[key];
        const data = getFilteredData(key, range);
        const values = data.map(d => d.y);

        const avg = (values.reduce((a, b) => a + b, 0) / values.length).toFixed(2);
        const min = Math.min(...values).toFixed(2);
        const max = Math.max(...values).toFixed(2);
        const latest = values[values.length - 1]?.toFixed(2) ?? '--';

        const grid = document.getElementById('statsGrid');
        const statColor = cfg.color;
        grid.innerHTML = `
            <div class="stat-box">
                <div class="stat-label">ล่าสุด</div>
                <div class="stat-value" style="color: ${statColor}">${latest}</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">เฉลี่ย</div>
                <div class="stat-value" style="color: ${statColor}">${avg}</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">ต่ำสุด</div>
                <div class="stat-value" style="color: ${statColor}">${min}</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">สูงสุด</div>
                <div class="stat-value" style="color: ${statColor}">${max}</div>
            </div>
        `;
    }

    // ================================================================
    //  CLOCK & REAL-TIME UPDATE
    // ================================================================

    function updateClock() {
        const now = new Date();
        document.getElementById('currentTime').textContent =
            `อัปเดตล่าสุด: ${now.toLocaleString('th-TH', { dateStyle: 'full', timeStyle: 'medium' })}`;
    }

    function updateDashboard() {
        const now = Date.now();

        for (const key of ['ph', 'ec', 'temp']) {
            const val = generateReading(key);
            historyData[key].push({ x: now, y: val });
            if (historyData[key].length > HISTORY_POINTS) historyData[key].shift();

            // Update card value
            document.getElementById(`${key}Value`).textContent = val;

            // Update status badge
            const status = getStatus(key, val);
            const statusEl = document.getElementById(`${key}Status`);
            statusEl.className = 'card-status ' + status;
            statusEl.innerHTML = statusText(status);

            // Update sparkline
            updateSparkline(key);
        }

        updateClock();

        // If modal is open, refresh it too
        if (currentModalKey && document.getElementById('modalOverlay').classList.contains('active')) {
            renderTrendChart(currentModalKey, currentRange);
            renderStats(currentModalKey, currentRange);
        }
    }

    // ================================================================
    //  INIT
    // ================================================================

    window.addEventListener('DOMContentLoaded', () => {
        createSparkline('phSparkline', 'ph');
        createSparkline('ecSparkline', 'ec');
        createSparkline('tempSparkline', 'temp');

        updateDashboard();

        // Auto-update every 5 seconds
        setInterval(updateDashboard, 5000);
    });

    // Close modal on Escape key
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });
    </script>
</body>
</html>
