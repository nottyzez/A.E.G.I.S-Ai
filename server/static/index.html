                <div className="font-mono text-[11px] text-[#A8C5DA]">
                  เวลาเดินปั๊มจริง: P1={simDosingResult.dosing_plan.pump1_ms}ms | P2={simDosingResult.dosing_plan.pump2_ms}ms | P3={simDosingResult.dosing_plan.pump3_ms}ms
                </div>
                <div className="text-white/80">{simDosingResult.ai_reason}</div>
              </div>

              <div className="flex flex-wrap items-center gap-2.5">
                <button
                  onClick={handleSyncScenarioToAnalyze}
                  className="px-4 py-2 rounded-xl bg-[#A8C5DA] hover:bg-[#bdd7ea] text-slate-950 font-inter font-bold text-xs transition-all"
                >
                  ซิงก์ผลจำลองไปหน้า Analyze &amp; โหลดลงปั๊ม A/B/C
                </button>
                {liveScenarioOverride && liveScenarioOverride.active && (
                  <button
                    onClick={() => {
                      setLiveScenarioOverride(null);
                      pushCommandLog('RESET_SCENARIO', 'คืนค่าการแสดงผลหน้า Analyze กลับสู่ข้อมูลชุดทดลองจริง');
                    }}
                    className="px-3.5 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-inter transition-all"
                  >
                    คืนค่าข้อมูลชุดทดลองจริง
                  </button>
                )}
              </div>
            </div>

            {/* Right 5 Cols: Live Command & Coexistence Telemetry Log */}
            <div className="lg:col-span-5 figma-card-dark p-6 flex flex-col justify-between">
              <div>
                <div className="flex items-center justify-between mb-3">
                  <h2 className="font-inter font-semibold text-base text-white">
                    Live Command &amp; Coexistence Telemetry Log
                  </h2>
                  <span className="text-[11px] font-mono text-emerald-300">
                    Schedule Protected ✓
                  </span>
                </div>
                <div className="space-y-2 max-h-[260px] overflow-y-auto pr-1">
                  {commandLog.map((item, idx) => (
                    <div
                      key={idx}
                      className="p-2.5 rounded-lg bg-white/5 border border-white/8 text-[11px] flex flex-col gap-1"
                    >
                      <div className="flex items-center justify-between font-mono">
                        <span className="text-[#C6C7F8] font-bold">
                          [{item.time}] {item.type}
                        </span>
                        <span className="text-emerald-300/90 text-[10px]">
                          {item.schedule_status}
                        </span>
                      </div>
                      <div className="text-white/80 leading-snug">{item.detail}</div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="pt-3 mt-3 border-t border-white/10 text-[11px] text-white/50 flex justify-between">
                <span>Dual-Mode API: /api/command • /api/cam_command • /api/override/simulate</span>
                <span>Auto-Revert Active</span>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // =========================================================================
    // 7. TAB 3: "ALL SAMPLE" VIEW (ALL 12 WATER SPINACH / ผักบุ้ง UNITS)
    // =========================================================================
    function AllSampleTabView({ selectedUnit, onSelectUnitAndAnalyze }) {
      const allUnitKeys = Object.keys(UNIT_META);

      return (
        <div className="w-full max-w-[1220px] mx-auto px-5 md:px-7 pt-5 pb-10 view-materialize">
          <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div>
              <h1 className="font-inter font-semibold text-3xl md:text-[36px] text-white tracking-tight">
                All Sample — 12 ชุดทดลองผักบุ้งไฮโดรโปนิกส์
              </h1>
              <p className="text-sm text-white/65 mt-1">
                เปรียบเทียบข้อมูลเซนเซอร์ pH, EC, อุณหภูมิ และภาพถ่ายใบผักบุ้งจริงครบทั้ง 4 ถังหลัก (23.3L) และ 8 ถ้วยทดลองซ้ำ (750mL)
              </p>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5">
            {allUnitKeys.map((uId) => {
              const summary = getUnitSensorSummary(uId);
              const photo = getUnitLeafPhoto(uId);
              const isSelected = selectedUnit === uId;

              return (
                <div
                  key={uId}
                  onClick={() => onSelectUnitAndAnalyze(uId)}
                  className={`figma-card-dark p-4 cursor-pointer flex flex-col justify-between transition-all hover:-translate-y-1 ${
                    isSelected ? 'ring-2 ring-[#C6C7F8]' : ''
                  }`}
                >
                  <div>
                    {/* Real ผักบุ้ง Leaf Image */}
                    <div className="relative h-40 w-full rounded-xl overflow-hidden mb-3.5 border border-white/12 bg-black/40">
                      <img
                        src={photo}
                        alt={`ผักบุ้ง ${summary.label}`}
                        className="w-full h-full object-cover hover:scale-105 transition-transform duration-500"
                        onError={(e) => {
                          if (e.target.dataset.triedFallback) return;
                          e.target.dataset.triedFallback = 'true';
                          e.target.src = window.__AEGIS_ASSET_RESOLVER__('images_real/Control/21_10_2026-time08_00.jpg');
                        }}
                      />
                      <div className="absolute top-2.5 left-2.5 px-2.5 py-0.5 rounded-full bg-black/70 backdrop-blur-md text-[10px] font-mono text-white border border-white/15">
                        {summary.type}
                      </div>
                      <div
                        className="absolute top-2.5 right-2.5 w-3 h-3 rounded-full border border-white"
                        style={{ backgroundColor: summary.badgeColor }}
                      />
                    </div>

                    <h3 className="font-inter font-semibold text-base text-white mb-0.5">
                      {summary.label}
                    </h3>
                    <p className="text-xs text-[#C6C7F8] mb-3">{summary.npkStatus}</p>

                    {/* Sensor Readouts */}
                    <div className="grid grid-cols-3 gap-2 p-2.5 rounded-xl bg-white/5 border border-white/8 text-center mb-3">
                      <div>
                        <div className="text-[10px] text-white/45 font-mono">pH</div>
                        <div className="font-work font-bold text-sm text-white">{summary.ph}</div>
                      </div>
                      <div>
                        <div className="text-[10px] text-white/45 font-mono">EC</div>
                        <div className="font-work font-bold text-sm text-[#A8C5DA]">{summary.ec}</div>
                      </div>
                      <div>
                        <div className="text-[10px] text-white/45 font-mono">Temp</div>
                        <div className="font-work font-bold text-sm text-white">{summary.temp}°C</div>
                      </div>
                    </div>
                  </div>

                  <div className="pt-2 border-t border-white/10 flex items-center justify-between text-xs">
                    <span className="text-white/60 truncate max-w-[170px]">
                      {summary.symptomNote}
                    </span>
                    <span className="text-[#C6C7F8] font-medium shrink-0">
                      Analyze →
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // =========================================================================
    // 8. MAIN APPLICATION (WARP TRANSITION + FIGMA SNOWUI SHELL)
    // =========================================================================
    function App() {
      const [currentView, setCurrentView] = useState('home'); // 'home' | 'dashboard'
      const [activeTab, setActiveTab] = useState('Analyze'); // 'Analyze' | 'Electronic Control' | 'All Sample'
      const [selectedUnit, setSelectedUnit] = useState('Control');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [isWarping, setIsWarping] = useState(false);
      const [dosingStatus, setDosingStatus] = useState('');
      const [liveScenarioOverride, setLiveScenarioOverride] = useState(null);

      const unitSummary = useMemo(() => {
        const base = getUnitSensorSummary(selectedUnit);
        if (liveScenarioOverride && liveScenarioOverride.active) {
          return {
            ...base,
            ph: liveScenarioOverride.ph.toFixed(2),
            ec: liveScenarioOverride.ec.toFixed(3),
            temp: liveScenarioOverride.temp.toFixed(1),
            npkStatus: liveScenarioOverride.npkStatus || base.npkStatus,
            dosingRecommendation: liveScenarioOverride.dosingRecommendation || base.dosingRecommendation,
            probs: liveScenarioOverride.probs || base.probs,
          };
        }
        return base;
      }, [selectedUnit, liveScenarioOverride]);

      // Trigger 3D Zoom-In Warp Transition between Home and Dashboard
      const triggerViewWarp = (targetView, targetTab = 'Analyze') => {
        if (isWarping) return;
        setIsWarping(true);
        setTimeout(() => {
          setCurrentView(targetView);
          if (targetTab) setActiveTab(targetTab);
        }, 340);
        setTimeout(() => {
          setIsWarping(false);
        }, 820);
      };

      const handleTriggerDose = (summary) => {
        setDosingStatus('กำลังโดสสารละลาย...');
        setTimeout(() => {
          setDosingStatus(`โดสสำเร็จ (${summary.short}) ✓`);
          setTimeout(() => setDosingStatus(''), 3000);
        }, 900);
      };

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        const q = searchQuery.trim().toLowerCase();
        if (!q) return;
        const match = Object.keys(UNIT_META).find(
          (k) =>
            k.toLowerCase() === q ||
            UNIT_META[k].label.toLowerCase().includes(q) ||
            UNIT_META[k].short.toLowerCase().includes(q)
        );
        if (match) {
          setSelectedUnit(match);
          setActiveTab('Analyze');
        }
      };

      return (
        <div className="relative min-h-screen w-full overflow-x-hidden select-none">
          {/* 3D Layered Stars + Periodic Meteor Shower + Mountain Night Sky */}
          <CosmicThreeBackground currentView={currentView} isWarping={isWarping} />

          {/* VIEW 1: HOME PAGE */}
          {currentView === 'home' && (
            <HomeView
              onNavigateDashboard={(tabName) => triggerViewWarp('dashboard', tabName || 'Analyze')}
            />
          )}

          {/* VIEW 2: FIGMA SNOWUI "A.E.G.I.S ANALYZE" DASHBOARD */}
          {currentView === 'dashboard' && (
            <div className="figma-analyze-shell relative z-10">
              {/* =============================================================
                  LEFT SIDEBAR (212px Figma SnowUI Spec)
                 ============================================================= */}
              <aside className={`figma-sidebar ${sidebarCollapsed ? 'collapsed' : ''}`}>
                <div className="flex flex-col gap-6">
                  {/* Top User Profile Badge: Avatar (24px) + "A.E.G.I.S Team" */}
                  <div className="flex items-center gap-2.5 px-2 py-1">
                    <div className="w-6 h-6 rounded-full bg-gradient-to-tr from-[#7094F4] to-[#C6C7F8] flex items-center justify-center text-slate-950 font-bold text-xs shrink-0 shadow">
                      A
                    </div>
                    {!sidebarCollapsed && (
                      <span className="font-inter font-normal text-[14px] leading-[20px] text-white truncate">
                        A.E.G.I.S Team
                      </span>
                    )}
                  </div>

                  {/* React Bits <BranchedMenu /> Tree-Branch Navigation with Dynamic SVG Curves */}
                  <BranchedMenu
                    items={[
                      {
                        section: 'Menu',
                        children: [
                          {
                            id: 'home',
                            label: 'Home',
                            title: 'กลับหน้า Home (3D Galaxy Warp)',
                            icon: <span className="w-1.5 h-1.5 rounded-full bg-white/35" />,
                            onClick: () => triggerViewWarp('home'),
                          },
                          {
                            id: 'projects',
                            label: 'Projects',
                            title: 'ชุดทดลองผักบุ้งทั้งหมด 12 ยูนิต',
                            icon: <span className="w-1.5 h-1.5 rounded-full bg-white/35" />,
                            onClick: () => setActiveTab('All Sample'),
                          },
                        ],
                      },
                      {
                        section: 'Dashboards',
                        children: [
                          {
                            id: 'Analyze',
                            label: 'Analyze',
                            title: 'Analyze',
                            icon: <IconChartPieSlice />,
                          },
                          {
                            id: 'Electronic Control',
                            label: 'Electronic Control',
                            title: 'Electronic Control',
                            icon: <IconElectronicControl />,
                          },
                          {
                            id: 'All Sample',
                            label: 'All Sample',
                            title: 'All Sample',
                            icon: <IconFolderNotch />,
                          },
                        ],
                      },
                    ]}
                    active={activeTab}
                    onSelect={(id) => setActiveTab(id)}
                    collapsed={sidebarCollapsed}
                  />
                </div>

                {/* Bottom Logo Badge: SNOWUI (Hidden per Figma Spec) */}
                <div className="figma-sidebar-logo pt-6 px-2 flex items-center justify-center sm:justify-start" style={{ display: 'none' }}>
                  <IconSnowUILogo />
                </div>
              </aside>

              {/* =============================================================
                  MAIN CONTENT AREA (Top Header 68px + Active Tab Body)
                 ============================================================= */}
              <div className="flex-1 flex flex-col min-w-0">
                {/* Top Header (height: 68px Figma Spec) */}
                <header className="figma-header">
                  {/* Left: Sidebar Toggle + Star + Breadcrumb "Dashboards / Analyze" */}
                  <div className="flex items-center gap-2">
                    <div className="flex items-center gap-1">
                      <button
                        onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                        className="figma-icon-btn"
                        title="ย่อ/ขยายแถบเมนูด้านซ้าย"
                      >
                        <IconSidebarToggle />
                      </button>
                      <button
                        onClick={() => triggerViewWarp('home')}
                        className="figma-icon-btn"
                        title="ดาวเด่น / กลับหน้า Home"
                      >
                        <IconStar />
                      </button>
                    </div>

                    {/* Breadcrumb */}
                    <div className="flex items-center gap-2 pl-2 text-[14px] leading-[20px] font-inter">
                      <span
                        onClick={() => setActiveTab('Analyze')}
                        className="text-white/40 hover:text-white/80 cursor-pointer transition-colors px-1.5 py-0.5 rounded"
                      >
                        Dashboards
                      </span>
                      <span className="text-white/20">/</span>
                      <span className="text-white font-normal px-1.5 py-0.5">
                        {activeTab}
                      </span>
                    </div>
                  </div>

                  {/* Right: Search Input (160x28, rgba(255,255,255,0.1), radius 8px) + 4 Icon Buttons */}
                  <div className="flex items-center gap-4">
                    <form
                      onSubmit={handleSearchSubmit}
                      className="hidden sm:flex items-center justify-between px-2.5 py-1 w-[160px] h-[28px] rounded-[8px] bg-white/10 border border-white/5 focus-within:border-white/25 transition-all"
                    >
                      <div className="flex items-center gap-1.5 flex-1 min-w-0">
                        <IconSearch />
                        <input
                          type="text"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          placeholder="Search"
                          className="bg-transparent text-[14px] leading-[20px] text-white placeholder-white/40 focus:outline-none w-full font-inter"
                        />
                      </div>
                      <span className="text-[12px] leading-[16px] text-white/40 font-inter ml-1">
                        ⌘/
                      </span>
                    </form>

                    {/* 4 Action Icons (Sun, History, Bell, Right Rail) */}
                    <div className="flex items-center gap-1">
                      <button
                        onClick={() => triggerViewWarp('home')}
                        className="figma-icon-btn"
                        title="สลับมุมมอง Galaxy Home"
                      >
                        <IconSun />
                      </button>
                      <button
                        onClick={() => setSelectedUnit('Control')}
                        className="figma-icon-btn"
                        title="รีเซ็ตไปที่ถัง Control"
                      >
                        <IconHistory />
                      </button>
                      <button
                        onClick={() => handleTriggerDose(unitSummary)}
                        className="figma-icon-btn"
                        title="แจ้งเตือนสถานะธาตุอาหารผักบุ้ง"
                      >
                        <IconBell />
                      </button>
                      <button
                        onClick={() =>
                          setActiveTab(
                            activeTab === 'Analyze'
                              ? 'Electronic Control'
                              : activeTab === 'Electronic Control'
                              ? 'All Sample'
                              : 'Analyze'
                          )
                        }
                        className="figma-icon-btn"
                        title="สลับแท็บถัดไป"
                      >
                        <IconSidebarToggle />
                      </button>
                    </div>
                  </div>
                </header>

                {/* Active Dashboard Tab Body with React Bits <AnimatedContent /> */}
                <main className="flex-1 overflow-y-auto">
                  <AnimatedContent
                    key={activeTab}
                    distance={20}
                    duration={0.45}
                    blur={4}
                    direction="vertical"
                    ease="cubic-bezier(0.22, 1, 0.36, 1)"
                  >
                    {activeTab === 'Analyze' && (
                      <AnalyzeTabView
                        selectedUnit={selectedUnit}
                        setSelectedUnit={setSelectedUnit}
                        unitSummary={unitSummary}
                        onTriggerDose={handleTriggerDose}
                        dosingStatus={dosingStatus}
                        onSwitchTab={setActiveTab}
                      />
                    )}

                    {activeTab === 'Electronic Control' && (
                      <ElectronicControlTabView
                        selectedUnit={selectedUnit}
                        unitSummary={unitSummary}
                        onTriggerDose={handleTriggerDose}
                        liveScenarioOverride={liveScenarioOverride}
                        setLiveScenarioOverride={setLiveScenarioOverride}
                      />
                    )}

                    {activeTab === 'All Sample' && (
                      <AllSampleTabView
                        selectedUnit={selectedUnit}
                        onSelectUnitAndAnalyze={(uId) => {
                          setSelectedUnit(uId);
                          setActiveTab('Analyze');
                        }}
                      />
                    )}
                  </AnimatedContent>
                </main>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
