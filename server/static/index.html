    // 7. MAIN APPLICATION (WARP TRANSITION + FIGMA SNOWUI SHELL)
    // =========================================================================
    function App() {
      const [currentView, setCurrentView] = useState('home'); // 'home' | 'dashboard'
      const [activeTab, setActiveTab] = useState('Analyze'); // 'Analyze' | 'Electronic Control'
      const [selectedUnit, setSelectedUnit] = useState('Control');
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [searchQuery, setSearchQuery] = useState('');
      const [isWarping, setIsWarping] = useState(false);
      const [dosingStatus, setDosingStatus] = useState('');
      const [liveScenarioOverride, setLiveScenarioOverride] = useState(null);

      const unitSummary = useMemo(() => {
        const base = getUnitSensorSummary(selectedUnit);
        if (liveScenarioOverride && liveScenarioOverride.active) {
          return {
            ...base,
            ph: liveScenarioOverride.ph.toFixed(2),
            ec: liveScenarioOverride.ec.toFixed(3),
            temp: liveScenarioOverride.temp.toFixed(1),
            npkStatus: liveScenarioOverride.npkStatus || base.npkStatus,
            dosingRecommendation: liveScenarioOverride.dosingRecommendation || base.dosingRecommendation,
            probs: liveScenarioOverride.probs || base.probs,
          };
        }
        return base;
      }, [selectedUnit, liveScenarioOverride]);

      // Trigger 3D Zoom-In Warp Transition between Home and Dashboard
      const triggerViewWarp = (targetView, targetTab = 'Analyze') => {
        if (isWarping) return;
        setIsWarping(true);
        setTimeout(() => {
          setCurrentView(targetView);
          if (targetTab) setActiveTab(targetTab);
        }, 340);
        setTimeout(() => {
          setIsWarping(false);
        }, 820);
      };

      const handleTriggerDose = (summary) => {
        setDosingStatus('กำลังโดสสารละลาย...');
        setTimeout(() => {
          setDosingStatus(`โดสสำเร็จ (${summary.short}) ✓`);
          setTimeout(() => setDosingStatus(''), 3000);
        }, 900);
      };

      const handleSearchSubmit = (e) => {
        e.preventDefault();
        const q = searchQuery.trim().toLowerCase();
        if (!q) return;
        const match = Object.keys(UNIT_META).find(
          (k) =>
            k.toLowerCase() === q ||
            UNIT_META[k].label.toLowerCase().includes(q) ||
            UNIT_META[k].short.toLowerCase().includes(q)
        );
        if (match) {
          setSelectedUnit(match);
          setActiveTab('Analyze');
        }
      };

      return (
        <div className="relative min-h-screen w-full overflow-x-hidden select-none">
          {/* 3D Layered Stars + Periodic Meteor Shower + Mountain Night Sky */}
          <CosmicThreeBackground currentView={currentView} isWarping={isWarping} />

          {/* VIEW 1: HOME PAGE */}
          {currentView === 'home' && (
            <HomeView
              onNavigateDashboard={(tabName) => triggerViewWarp('dashboard', tabName || 'Analyze')}
            />
          )}

          {/* VIEW 2: FIGMA SNOWUI "A.E.G.I.S ANALYZE" DASHBOARD */}
          {currentView === 'dashboard' && (
            <div className="figma-analyze-shell relative z-10">
              {/* =============================================================
                  LEFT SIDEBAR (212px Figma SnowUI Spec)
                 ============================================================= */}
              <aside className={`figma-sidebar ${sidebarCollapsed ? 'collapsed' : ''}`}>
                <div className="flex flex-col gap-6">
                  {/* Top User Profile Badge: Avatar (24px) + "A.E.G.I.S Team" */}
                  <div className="flex items-center gap-2.5 px-2 py-1">
                    <div className="w-6 h-6 rounded-full bg-gradient-to-tr from-[#7094F4] to-[#C6C7F8] flex items-center justify-center text-slate-950 font-bold text-xs shrink-0 shadow">
                      A
                    </div>
                    {!sidebarCollapsed && (
                      <span className="font-inter font-normal text-[14px] leading-[20px] text-white truncate">
                        A.E.G.I.S Team
                      </span>
                    )}
                  </div>

                  {/* React Bits <BranchedMenu /> Tree-Branch Navigation with Dynamic SVG Curves */}
                  <BranchedMenu
                    items={[
                      {
                        section: 'Menu',
                        children: [
                          {
                            id: 'home',
                            label: 'Home',
                            title: 'กลับหน้า Home (3D Galaxy Warp)',
                            icon: <span className="w-1.5 h-1.5 rounded-full bg-white/35" />,
                            onClick: () => triggerViewWarp('home'),
                          },
                        ],
                      },
                      {
                        section: 'Dashboards',
                        children: [
                          {
                            id: 'Analyze',
                            label: 'Analyze',
                            title: 'Analyze',
                            icon: <IconChartPieSlice />,
                          },
                          {
                            id: 'Electronic Control',
                            label: 'Electronic Control',
                            title: 'Electronic Control',
                            icon: <IconElectronicControl />,
                          },
                        ],
                      },
                    ]}
                    active={activeTab}
                    onSelect={(id) => setActiveTab(id)}
                    collapsed={sidebarCollapsed}
                  />
                </div>

                {/* Bottom Logo Badge: SNOWUI (Hidden per Figma Spec) */}
                <div className="figma-sidebar-logo pt-6 px-2 flex items-center justify-center sm:justify-start" style={{ display: 'none' }}>
                  <IconSnowUILogo />
                </div>
              </aside>

              {/* =============================================================
                  MAIN CONTENT AREA (Top Header 68px + Active Tab Body)
                 ============================================================= */}
              <div className="flex-1 flex flex-col min-w-0">
                {/* Top Header (height: 68px Figma Spec) */}
                <header className="figma-header">
                  {/* Left: Sidebar Toggle + Star + Breadcrumb "Dashboards / Analyze" */}
                  <div className="flex items-center gap-2">
                    <div className="flex items-center gap-1">
                      <button
                        onClick={() => setSidebarCollapsed(!sidebarCollapsed)}
                        className="figma-icon-btn"
                        title="ย่อ/ขยายแถบเมนูด้านซ้าย"
                      >
                        <IconSidebarToggle />
                      </button>
                      <button
                        onClick={() => triggerViewWarp('home')}
                        className="figma-icon-btn"
                        title="ดาวเด่น / กลับหน้า Home"
                      >
                        <IconStar />
                      </button>
                    </div>

                    {/* Breadcrumb */}
                    <div className="flex items-center gap-2 pl-2 text-[14px] leading-[20px] font-inter">
                      <span
                        onClick={() => setActiveTab('Analyze')}
                        className="text-white/40 hover:text-white/80 cursor-pointer transition-colors px-1.5 py-0.5 rounded"
                      >
                        Dashboards
                      </span>
                      <span className="text-white/20">/</span>
                      <span className="text-white font-normal px-1.5 py-0.5">
                        {activeTab}
                      </span>
                    </div>
                  </div>

                  {/* Right: Search Input (160x28, rgba(255,255,255,0.1), radius 8px) + 4 Icon Buttons */}
                  <div className="flex items-center gap-4">
                    <form
                      onSubmit={handleSearchSubmit}
                      className="hidden sm:flex items-center justify-between px-2.5 py-1 w-[160px] h-[28px] rounded-[8px] bg-white/10 border border-white/5 focus-within:border-white/25 transition-all"
                    >
                      <div className="flex items-center gap-1.5 flex-1 min-w-0">
                        <IconSearch />
                        <input
                          type="text"
                          value={searchQuery}
                          onChange={(e) => setSearchQuery(e.target.value)}
                          placeholder="Search"
                          className="bg-transparent text-[14px] leading-[20px] text-white placeholder-white/40 focus:outline-none w-full font-inter"
                        />
                      </div>
                      <span className="text-[12px] leading-[16px] text-white/40 font-inter ml-1">
                        ⌘/
                      </span>
                    </form>

                    {/* 4 Action Icons (Sun, History, Bell, Right Rail) */}
                    <div className="flex items-center gap-1">
                      <button
                        onClick={() => triggerViewWarp('home')}
                        className="figma-icon-btn"
                        title="สลับมุมมอง Galaxy Home"
                      >
                        <IconSun />
                      </button>
                      <button
                        onClick={() => setSelectedUnit('Control')}
                        className="figma-icon-btn"
                        title="รีเซ็ตไปที่ถัง Control"
                      >
                        <IconHistory />
                      </button>
                      <button
                        onClick={() => handleTriggerDose(unitSummary)}
                        className="figma-icon-btn"
                        title="แจ้งเตือนสถานะธาตุอาหารผักบุ้ง"
                      >
                        <IconBell />
                      </button>
                      <button
                        onClick={() =>
                          setActiveTab(
                            activeTab === 'Analyze' ? 'Electronic Control' : 'Analyze'
                          )
                        }
                        className="figma-icon-btn"
                        title="สลับแท็บถัดไป"
                      >
                        <IconSidebarToggle />
                      </button>
                    </div>
                  </div>
                </header>

                {/* Active Dashboard Tab Body with React Bits <AnimatedContent /> */}
                <main className="flex-1 overflow-y-auto">
                  <AnimatedContent
                    key={activeTab}
                    distance={20}
                    duration={0.45}
                    blur={4}
                    direction="vertical"
                    ease="cubic-bezier(0.22, 1, 0.36, 1)"
                  >
                    {activeTab === 'Analyze' && (
                      <AnalyzeTabView
                        selectedUnit={selectedUnit}
                        unitSummary={unitSummary}
                        onTriggerDose={handleTriggerDose}
                        dosingStatus={dosingStatus}
                      />
                    )}

                    {activeTab === 'Electronic Control' && (
                      <ElectronicControlTabView
                        selectedUnit={selectedUnit}
                        unitSummary={unitSummary}
                        onTriggerDose={handleTriggerDose}
                        liveScenarioOverride={liveScenarioOverride}
                        setLiveScenarioOverride={setLiveScenarioOverride}
                      />
                    )}
                  </AnimatedContent>
                </main>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
